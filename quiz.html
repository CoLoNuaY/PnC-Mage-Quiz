<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คุณเหมาะกับสายไหน?</title>
<style>
:root{
  --bg:#12101a; --card:#1c1930; --accent:#a78bfa; --accent2:#f472b6;
  --text:#f1eefc; --sub:#b3abcf; --border:#33305a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:'Sarabun','Segoe UI',sans-serif;
  display:flex; justify-content:center; padding:24px 14px;
}
.wrap{width:100%; max-width:560px;}
h1{font-size:1.4rem; text-align:center; margin:0 0 4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;}
.sub{text-align:center; color:var(--sub); font-size:.85rem; margin-bottom:20px;}
.bar{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:18px;}
.bar>div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s;}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px;}
.qnum{color:var(--accent); font-weight:700; font-size:.8rem; margin-bottom:6px;}
.qtext{font-size:1.05rem; margin-bottom:14px; line-height:1.5;}
.opt{display:block; width:100%; text-align:left; background:#252140; border:1px solid var(--border);
  color:var(--text); padding:12px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer;
  font-size:.95rem; line-height:1.4; transition:.15s;}
.opt:hover{border-color:var(--accent);}
.opt.sel{border-color:var(--accent2); background:#3a1f3f;}
.nav{display:flex; justify-content:space-between; margin-top:6px;}
button.nav-btn{background:none; border:1px solid var(--border); color:var(--sub); padding:10px 18px;
  border-radius:10px; cursor:pointer; font-size:.9rem;}
button.nav-btn:disabled{opacity:.35; cursor:default;}
button.primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#160f22; border:none;
  font-weight:700;}
#result{display:none; text-align:center;}
.emoji{font-size:4rem; margin-bottom:6px;}
.rname{font-size:1.5rem; font-weight:700; margin-bottom:6px;}
.rdesc{color:var(--sub); font-size:.95rem; margin-bottom:18px; line-height:1.6;}
.scores{text-align:left; font-size:.85rem; color:var(--sub); margin-bottom:18px;}
.scores div{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border);}
#septaWrap{margin:6px auto 20px; max-width:340px;}
.axisLabel{font-size:11px; fill:var(--sub); font-weight:700;}
.axisLabel.top{fill:var(--accent2);}
#quizArea{display:block;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f6f5fb; --card:#ffffff; --text:#221d33; --sub:#6b6484; --border:#e2def0;}
  :root:not([data-theme="dark"]) .opt{background:#f0edfb; color:#221d33;}
  :root:not([data-theme="dark"]) .opt.sel{background:#f9e6f4;}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 คุณเหมาะกับสายไหน?</h1>
<div class="sub">ควิซจอมเวทย์ 7 สาย — ตอบตามสัญชาตญาณ</div>
<div class="bar"><div id="prog" style="width:5%"></div></div>

<div id="quizArea">
  <div class="card">
    <div class="qnum" id="qnum">ข้อ 1 / 20</div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn">ย้อนกลับ</button>
    <button class="nav-btn primary" id="nextBtn">ถัดไป</button>
  </div>
</div>

<div id="result">
  <div class="emoji" id="rEmoji"></div>
  <div class="rname" id="rName"></div>
  <div class="rdesc" id="rDesc"></div>
  <div id="septaWrap"></div>
  <div class="scores" id="rScores"></div>
  <button class="nav-btn primary" style="width:100%" onclick="restart()">ทำอีกครั้ง</button>
</div>
</div>

let cur = 0;
const answers = new Array(20).fill(null); // stores ORIGINAL option index (0-6), independent of shuffle
let optionOrder = []; // optionOrder[qi] = shuffled array of original indices, display order

function shuffled(n){
  const arr = Array.from({length:n},(_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function newShuffle(){
  optionOrder = questions.map(q=>shuffled(q[1].length));
}

function renderQ(){
  const [qtext, opts] = questions[cur];
  document.getElementById('qnum').textContent = `ข้อ ${cur+1} / 20`;
  document.getElementById('qtext').textContent = qtext;
  document.getElementById('prog').style.width = ((cur+1)/20*100)+'%';
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  optionOrder[cur].forEach((origIdx,displayPos)=>{
    const btn = document.createElement('button');
    btn.className = 'opt'+(answers[cur]===origIdx?' sel':'');
    btn.textContent = String.fromCharCode(65+displayPos)+'. '+opts[origIdx];
    btn.onclick = ()=>{ answers[cur]=origIdx; renderQ(); };
    optsEl.appendChild(btn);
  });
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').textContent = cur===19 ? 'ดูผลลัพธ์' : 'ถัดไป';
}

document.getElementById('prevBtn').onclick = ()=>{ if(cur>0){cur--; renderQ();} };
document.getElementById('nextBtn').onclick = ()=>{
  if(answers[cur]===null){ alert('กรุณาเลือกคำตอบก่อนนะ'); return; }
  if(cur<19){ cur++; renderQ(); } else { showResult(); }
};

function drawSeptagram(tally, top){
  const N = 7, size = 320, cx = size/2, cy = size/2, R = 118;
  const maxVal = Math.max(4, ...KEYS.map(k=>tally[k]));
  const angle = i => -Math.PI/2 + i*(2*Math.PI/N);
  const pt = (i,r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];

  // outer heptagon rings (guide lines)
  let rings = '';
  [0.33,0.66,1].forEach(f=>{
    const p = Array.from({length:N},(_,i)=>pt(i,R*f).join(',')).join(' ');
    rings += `<polygon points="${p}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  // axis lines
  let axes = '';
  KEYS.forEach((k,i)=>{
    const [x,y] = pt(i,R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  });
  // data heptagram: connect every point to make star (skip-2 pattern) + filled polygon
  const dataPts = KEYS.map((k,i)=> pt(i, R * (tally[k]/maxVal)) );
  const fillPoly = dataPts.map(p=>p.join(',')).join(' ');
  // septagram star lines: connect each vertex to the one 2 steps away
  let star = '';
  for(let i=0;i<N;i++){
    const a = dataPts[i], b = dataPts[(i+2)%N];
    star += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--accent2)" stroke-width="1.5" opacity="0.85"/>`;
  }
  // labels
  let labels = '';
  KEYS.forEach((k,i)=>{
    const [x,y] = pt(i, R+26);
    labels += `<text class="axisLabel${k===top?' top':''}" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${CLASS_INFO[k].e}</text>`;
  });
  // dots on data points
  let dots = dataPts.map(([x,y],i)=>
    `<circle cx="${x}" cy="${y}" r="${KEYS[i]===top?5:3}" fill="${KEYS[i]===top?'var(--accent2)':'var(--accent)'}"/>`
  ).join('');

  document.getElementById('septaWrap').innerHTML = `
  <svg viewBox="0 0 ${size} ${size}" width="100%" height="auto">
    ${rings}${axes}
    <polygon points="${fillPoly}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    ${star}
    ${dots}
    ${labels}
  </svg>`;
}

function showResult(){
  const tally = {}; KEYS.forEach(k=>tally[k]=0);
  answers.forEach((ans,qi)=>{ tally[keyMaps[qi][ans]]++; });
  let top = KEYS[0];
  KEYS.forEach(k=>{ if(tally[k]>tally[top]) top=k; });
  const info = CLASS_INFO[top];
  document.getElementById('rEmoji').textContent = info.e;
  document.getElementById('rName').textContent = info.e+' '+info.n;
  document.getElementById('rDesc').textContent = info.d;
  drawSeptagram(tally, top);
  const sorted = KEYS.slice().sort((a,b)=>tally[b]-tally[a]);
  document.getElementById('rScores').innerHTML = sorted.map(k=>
    `<div><span>${CLASS_INFO[k].e} ${CLASS_INFO[k].n}</span><span>${tally[k]}</span></div>`
  ).join('');
  document.getElementById('quizArea').style.display='none';
  document.getElementById('result').style.display='block';
}

function restart(){
  cur=0; answers.fill(null);
  newShuffle();
  document.getElementById('result').style.display='none';
  document.getElementById('quizArea').style.display='block';
  renderQ();
}

newShuffle();
renderQ();
</script>
